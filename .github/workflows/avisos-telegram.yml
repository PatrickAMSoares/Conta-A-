name: Avisos de vencimento no Telegram

on:
  schedule:
    # 10:47 UTC ~= 07:47 no horário de Brasília (UTC-3, sem horário de verão).
    # Minuto quebrado de propósito: agendamentos em horas cheias (ex. 11:00)
    # competem com um volume enorme de outros workflows no GitHub inteiro e
    # atrasam bem mais — um minuto "torto" costuma rodar mais perto do horário.
    - cron: '47 10 * * *'
  workflow_dispatch: {}

jobs:
  enviar-avisos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do script
        run: npm install firebase-admin@^12 --no-save

      - name: Enviar avisos
        run: node scripts/enviar-avisos-telegram.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
